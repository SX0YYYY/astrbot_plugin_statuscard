name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check version consistency
        run: |
          python - <<'PY'
          import re, pathlib
          root = pathlib.Path("astrbot_plugin_statuscard")
          version_py = re.search(r'__version__\s*=\s*"([^"]+)"', (root / "version.py").read_text(encoding="utf-8")).group(1)
          metadata = re.search(r"^version:\s*(\S+)\s*$", (root / "metadata.yaml").read_text(encoding="utf-8"), re.M).group(1)
          badge = re.search(r"version-([\d.]+)-blue", (root / "README.md").read_text(encoding="utf-8")).group(1)
          assert version_py == metadata == badge, (
              f"version mismatch: version.py={version_py} metadata.yaml={metadata} README badge={badge}"
          )
          print("version consistent:", version_py)
          PY
      - name: Run tests
        run: python -m pytest -q
