name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check version consistency
        run: |
          python - <<'PY'
          import re, pathlib
          root = pathlib.Path(".")
          version_py = re.search(r'__version__\s*=\s*"([^"]+)"', (root / "version.py").read_text(encoding="utf-8")).group(1)
          metadata = re.search(r"^version:\s*(\S+)\s*$", (root / "metadata.yaml").read_text(encoding="utf-8"), re.M).group(1)
          badge = re.search(r"version-([\d.]+)-blue", (root / "README.md").read_text(encoding="utf-8")).group(1)
          changelog = re.search(r"^## v([0-9][^\s]*)", (root / "CHANGELOG.md").read_text(encoding="utf-8"), re.M).group(1)
          assert version_py == metadata == badge == changelog, (
              f"version mismatch: version.py={version_py} metadata.yaml={metadata} "
              f"README badge={badge} CHANGELOG={changelog}"
          )
          print("version consistent:", version_py)
          PY
      - name: Check schema and i18n
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path(".")
          json.loads((root / "_conf_schema.json").read_text(encoding="utf-8-sig"))
          zh = json.loads((root / ".astrbot-plugin/i18n/zh-CN.json").read_text(encoding="utf-8"))
          en = json.loads((root / ".astrbot-plugin/i18n/en-US.json").read_text(encoding="utf-8"))
          def keys(node, prefix=""):
              out = set()
              if isinstance(node, dict):
                  for key, value in node.items():
                      out.add(prefix + key)
                      out |= keys(value, prefix + key + ".")
              return out
          missing_en = keys(zh) - keys(en)
          missing_zh = keys(en) - keys(zh)
          assert not missing_en and not missing_zh, (missing_en, missing_zh)
          print("schema/i18n consistent")
          PY
      - name: Run tests
        run: python -m pytest -q
