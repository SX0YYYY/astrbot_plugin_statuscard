<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>服务器状态看板</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">SC</div>
        <div class="brand-text">
          <h1 data-i18n="app_name">服务器状态看板</h1>
          <p id="subtitle" data-i18n="loading">加载中…</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="plugin-version">v--</span>
        <button class="ghost" id="refresh" type="button" data-i18n="refresh">刷新</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="看板标签" data-i18n-aria="tabs_label">
      <button class="tab active" id="tab-overview" data-tab="overview" role="tab" aria-selected="true" aria-controls="panel-overview" tabindex="0" data-i18n="tab_overview">概览</button>
      <button class="tab" id="tab-history" data-tab="history" role="tab" aria-selected="false" aria-controls="panel-history" tabindex="-1" data-i18n="tab_history">历史</button>
      <button class="tab" id="tab-events" data-tab="events" role="tab" aria-selected="false" aria-controls="panel-events" tabindex="-1" data-i18n="tab_events">事件</button>
      <button class="tab" id="tab-reports" data-tab="reports" role="tab" aria-selected="false" aria-controls="panel-reports" tabindex="-1" data-i18n="tab_reports">日报</button>
    </nav>

    <main id="panels">
      <section class="panel active" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
        <div id="audit-banner" class="audit-banner" hidden></div>
        <div class="metric-grid" id="metrics"></div>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_network">网络</h2>
            <span id="network-month">本月流量</span>
          </div>
          <div class="network-grid" id="network"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_quality">LLM 服务质量</h2>
            <span id="provider-summary">--</span>
          </div>
          <div class="network-grid" id="provider-overview"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_monitors">服务监测</h2>
            <span id="monitor-summary">--</span>
          </div>
          <div class="monitor-list" id="monitors"></div>
        </div>
        <div class="card" id="verify-card">
          <div class="card-head">
            <h2 data-i18n="verify_title">立即验证</h2>
            <span data-i18n="verify_hint_short">保存配置后可在这里验证</span>
          </div>
          <p class="card-note" data-i18n="verify_hint">
            「推送目标」会真实发送一条验证消息并回报回执；「监测项」只探测一次、不影响告警状态；「Webhook」向本插件监听端口发送模拟事件，走通接收→解析→推送整条链路。
          </p>
          <div class="segmented" id="verify-buttons">
            <button type="button" id="verify-targets" data-i18n="verify_targets">验证推送目标</button>
            <button type="button" id="verify-monitors" data-i18n="verify_monitors">验证监测项</button>
            <button type="button" id="verify-webhook" data-i18n="verify_webhook">验证 Webhook</button>
          </div>
          <div id="verify-result"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_processes">Top 进程</h2>
            <span data-i18n="label_process_window">最近 10 秒平均（占整机 %）</span>
          </div>
          <div class="table-wrap">
            <table class="table" id="process-table">
              <thead><tr>
                <th scope="col" data-i18n="table_rank">#</th>
                <th scope="col" data-i18n="table_process">进程</th>
                <th scope="col" data-i18n="table_cpu">CPU</th>
                <th scope="col" data-i18n="table_mem">内存</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history">
        <div class="chart-loading" id="history-loading" hidden>
          <span class="chart-spinner" aria-hidden="true"></span>
          <span data-i18n="history_loading">加载中…</span>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_resources">资源趋势</h2>
            <div class="segmented" id="range-switch">
              <button type="button" data-range="24h" class="active" data-i18n="range_24h">24 小时</button>
              <button type="button" data-range="7d" data-i18n="range_7d">7 天</button>
              <button type="button" data-range="30d" data-i18n="range_30d">30 天</button>
            </div>
            <button type="button" id="export-csv" class="ghost" data-i18n="export_csv">导出 CSV</button>
          </div>
          <div class="card-note" id="history-range-note"></div>
          <p class="card-note" id="history-gap-note" hidden></p>
          <div class="legend" id="history-legend"></div>
          <div class="chart" id="history-chart"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_network_rate">网络速率</h2>
            <span id="network-note" class="card-note"></span>
          </div>
          <div class="legend" id="network-legend"></div>
          <div class="chart" id="network-chart"></div>
        </div>
      </section>

      <section class="panel" id="panel-events" role="tabpanel" aria-labelledby="tab-events">
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_events">异常事件</h2>
            <span id="event-summary" class="card-note"></span>
            <div class="segmented" id="event-switch">
              <button type="button" data-days="1" class="active" data-i18n="range_today">今天</button>
              <button type="button" data-days="7" data-i18n="range_7d">7 天</button>
              <button type="button" data-days="30" data-i18n="range_30d">30 天</button>
            </div>
          </div>
          <div class="event-list" id="event-list"></div>
        </div>
      </section>

      <section class="panel" id="panel-reports" role="tabpanel" aria-labelledby="tab-reports">
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_report">昨日日报</h2>
            <span id="report-day">--</span>
          </div>
          <div class="metric-grid" id="report-summary"></div>
          <div id="report-details"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="section_runs">发送记录</h2>
            <span data-i18n="label_recent_30">最近 30 次</span>
          </div>
          <div class="table-wrap">
            <table class="table" id="report-runs">
              <thead><tr>
                <th scope="col" data-i18n="table_date">日期</th>
                <th scope="col" data-i18n="table_time">时间</th>
                <th scope="col" data-i18n="table_result">结果</th>
                <th scope="col" data-i18n="table_method">方式</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
