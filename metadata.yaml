name: astrbot_plugin_statuscard
display_name: 服务器状态卡
desc: 把服务器的 CPU、内存、磁盘、网络和进程做成一张状态图发到 QQ；内置 Web 可视化统计面板（资源/网络/服务监测/异常/日报，支持导出 CSV），并支持资源与掉线告警、每日定时状态图、趋势日报、每周周报和服务可用性监测。
short_desc: 状态图 + Web 统计面板 + 告警 + 定时状态图 + 日报/周报 + 服务监测
